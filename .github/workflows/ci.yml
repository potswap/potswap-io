name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24 }   # Astro 7 needs Node >= 22.23.4
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: cd docs-site && npm ci && npm run build
